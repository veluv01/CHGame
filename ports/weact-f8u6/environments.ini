; Settings shared by the repository-root and standalone PlatformIO projects.
[env]
board = weact-f8u6
framework = arduino
lib_ldf_mode = chain+
monitor_speed = 115200
upload_protocol = chgame
custom_chgame_image = app
custom_chgame_sketch =
custom_chgame_opt = auto
custom_chgame_usb = auto
custom_chgame_rtlib = auto
custom_chgame_save_pages = auto
custom_chgame_export = yes

[env:bringup]
custom_chgame_save_pages = 0

[env:hello]
custom_chgame_sketch = Hello
custom_chgame_save_pages = 0

[env:game]
custom_chgame_sketch = CHFour

[env:game-debug]
extends = env:game
build_type = debug
custom_chgame_usb = serial
build_flags = -DCHGAME_DEBUG=1

[env:sdreader]
custom_chgame_sketch = CHSDtoUSB

[env:sdserial]
custom_chgame_sketch = CHSDtoSerial

[env:stlviewer]
custom_chgame_sketch = CHStlView

[env:bootloader]
custom_chgame_image = bootloader
custom_chgame_boot_mode = release
custom_chgame_menu = list
custom_chgame_style = rainbow

[env:bootloader-visual]
extends = env:bootloader
custom_chgame_menu = visual

[env:bootloader-usb]
extends = env:bootloader
custom_chgame_boot_mode = nomenu

[env:bootloader-static]
extends = env:bootloader
custom_chgame_style = static

[env:bootloader-visual-static]
extends = env:bootloader-visual
custom_chgame_style = static
