; Optional standalone entry point. The repository-root project is recommended.
[platformio]
default_envs = bringup
src_dir = src
boards_dir = platform/boards
extra_configs = environments.ini

[env]
platform = chgame-weact-${PROJECT_HASH}=symlink://${PROJECT_DIR}/platform
lib_extra_dirs = ../../platform/board/arduino/CHGame/libraries
