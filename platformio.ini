; Open the repository root in PlatformIO. Shared environments also support
; the standalone project under ports/weact-f8u6/.
[platformio]
default_envs = bringup
src_dir = ports/weact-f8u6/src
boards_dir = ports/weact-f8u6/platform/boards
extra_configs = ports/weact-f8u6/environments.ini

[env]
platform = chgame-weact-${PROJECT_HASH}=symlink://${PROJECT_DIR}/ports/weact-f8u6/platform
lib_extra_dirs = platform/board/arduino/CHGame/libraries
