; Open games/Stonebound in PlatformIO inside this CHGame fork.
[platformio]
default_envs = stonebound
src_dir = .
boards_dir = ../../ports/weact-f8u6/platform/boards

[env]
platform = chgame-stonebound-${PROJECT_HASH}=symlink://${PROJECT_DIR}/../../ports/weact-f8u6/platform
board = weact-f8u6
framework = arduino
lib_extra_dirs = ../../platform/board/arduino/CHGame/libraries
lib_ldf_mode = chain+
monitor_speed = 115200
upload_protocol = chgame
custom_chgame_image = app
custom_chgame_sketch = .
custom_chgame_opt = auto
custom_chgame_usb = auto
custom_chgame_rtlib = auto
custom_chgame_save_pages = 2
custom_chgame_export = yes

[env:stonebound]

[env:stonebound-debug]
extends = env:stonebound
build_type = debug
custom_chgame_usb = serial
build_flags = -DCHGAME_DEBUG=1
